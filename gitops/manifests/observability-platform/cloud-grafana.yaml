apiVersion: v1
kind: Service
metadata:
  name: cloud-grafana-server
  namespace: infra-monitoring
  labels:
    node: OCI-VM1
    role: unified-dashboard
spec:
  ports:
    - name: http-dashboard
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: cloud-grafana-server
  namespace: infra-monitoring
subsets:
  - addresses:
      - ip: 137.23.38.177
    ports:
      - name: http-dashboard
        port: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-grafana-info
  namespace: infra-monitoring
data:
  instance: "Oracle Cloud VM 1"
  ip: "137.23.38.177"
  ui_endpoint: "http://137.23.38.177:3000"
  version: "Grafana 13.3.1 Enterprise/OSS"
  dashboard: "homelab-overview"
  status: "ONLINE"
