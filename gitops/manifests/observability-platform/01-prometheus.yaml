apiVersion: v1
kind: Service
metadata:
  name: ct106-prometheus-core
  namespace: infra-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    node.homelab/id: "ct106"
    node.homelab/role: "central-metrics-engine"
spec:
  type: ExternalName
  externalName: 10.10.10.106
  ports:
    - name: http-tsdb
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ct106-prometheus-spec
  namespace: infra-monitoring
  labels:
    node.homelab/id: "ct106"
