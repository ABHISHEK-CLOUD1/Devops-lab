apiVersion: v1
kind: Service
metadata:
  name: oci-cloud-vm1-grafana
  namespace: infra-cloud
  labels:
    provider: oracle-cloud
    role: observability
spec:
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: oci-cloud-vm1-grafana
  namespace: infra-cloud
subsets:
  - addresses:
      - ip: 137.23.38.177
    ports:
      - name: grafana
        port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: oci-cloud-vm2-kubernetes
  namespace: infra-cloud
  labels:
    provider: oracle-cloud
    role: k8s-candidate
spec:
  ports:
    - name: node-exporter
      port: 9100
      targetPort: 9100
---
apiVersion: v1
kind: Endpoints
metadata:
  name: oci-cloud-vm2-kubernetes
  namespace: infra-cloud
subsets:
  - addresses:
      - ip: 130.210.84.113
    ports:
      - name: node-exporter
        port: 9100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-instances-info
  namespace: infra-cloud
data:
  cloud_vm1: "137.23.38.177 (Grafana 13.3.1 - Port 3000)"
  cloud_vm2: "130.210.84.113 (OCI Compute Node Exporter - Port 9100)"
  mesh_status: "Active SSH Reverse & Forward Tunnels via CT100"
