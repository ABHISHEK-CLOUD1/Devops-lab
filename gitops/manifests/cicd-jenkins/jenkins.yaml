apiVersion: v1
kind: Service
metadata:
  name: jenkins-ci-engine
  namespace: infra-cicd
  labels:
    node: CT102
    role: pipeline-orchestrator
spec:
  ports:
    - name: http-web
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: jenkins-ci-engine
  namespace: infra-cicd
subsets:
  - addresses:
      - ip: 10.10.10.102
    ports:
      - name: http-web
        port: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-info
  namespace: infra-cicd
data:
  vmid: "102"
  hostname: "jenkins"
  ip: "10.10.10.102"
  ui_endpoint: "http://10.10.10.102:8080"
  pipeline: "Devops-Pipeline"
  role: "CI/CD Pipeline Engine, Git SCM Polling, Docker Image Builder"
  status: "ONLINE"
