apiVersion: v1
kind: Service
metadata:
  name: control-node-gateway
  namespace: infra-network
  labels:
    node: CT100
    role: ansible-tunnel-hub
spec:
  ports:
    - name: ssh
      port: 22
      targetPort: 22
    - name: tunnel-cloud-vm1
      port: 9101
      targetPort: 9101
    - name: tunnel-cloud-vm2
      port: 9102
      targetPort: 9102
---
apiVersion: v1
kind: Endpoints
metadata:
  name: control-node-gateway
  namespace: infra-network
subsets:
  - addresses:
      - ip: 10.10.10.100
    ports:
      - name: ssh
        port: 22
      - name: tunnel-cloud-vm1
        port: 9101
      - name: tunnel-cloud-vm2
        port: 9102
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-node-info
  namespace: infra-network
data:
  vmid: "100"
  hostname: "control-node"
  ip: "10.10.10.100"
  role: "Ansible Orchestrator, SSH Tunnel Gateway & Central Keymaster"
  status: "ONLINE"
