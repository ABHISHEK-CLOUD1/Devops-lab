apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-website
  namespace: default
  labels:
    app.kubernetes.io/name: portfolio-website
    app.kubernetes.io/instance: production
    app.kubernetes.io/part-of: abhishek-portfolio
    repo: ABHISHEK-CLOUD1-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-website
  template:
    metadata:
      labels:
        app: portfolio-website
    spec:
      containers:
        - name: web
          image: abhis01/abhi-web-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-website-svc
  namespace: default
  labels:
    app: portfolio-website
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: portfolio-website
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-website-metadata
  namespace: default
data:
  source_repo: "https://github.com/ABHISHEK-CLOUD1/app"
  tech_stack: "React 19, CRACO, Tailwind CSS, Lucide React, Netlify-ready"
  deployed_target: "Docker Host (10.10.10.108:8080)"
  status: "SYNCHRONIZED"
