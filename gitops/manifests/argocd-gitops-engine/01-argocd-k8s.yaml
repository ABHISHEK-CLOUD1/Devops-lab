apiVersion: v1
kind: Service
metadata:
  name: ct109-argocd-control-plane
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    node.homelab/id: "ct109"
    node.homelab/role: "gitops-control-plane"
spec:
  type: ExternalName
  externalName: 10.10.10.109
  ports:
    - name: https-ui
      port: 30443
      targetPort: 30443
    - name: http-ui
      port: 30080
      targetPort: 30080
    - name: node-exporter
      port: 9100
      targetPort: 9100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ct109-argocd-spec
  namespace: argocd
  labels:
    node.homelab/id: "ct109"
data:
  README.md: |
    # CT109: Argo CD GitOps Engine & K3s Kubernetes Node
    
    - **Node VMID**: `109`
    - **Hostname**: `argocd-k8s`
    - **IP Address**: `10.10.10.109` (eth1) | `192.168.155.142` (eth0)
    - **Argo CD UI**: [https://192.168.155.142:30443](https://192.168.155.142:30443)
    - **Kubernetes**: K3s `v1.37.2+k3s1` (Single Node Cluster)
    - **Argo CD Version**: `v3.6.1`
    - **Primary Role**: Declarative GitOps Source of Truth & Reconciliation Controller
    
    ### Running Microservices:
    - `argocd-server`: Web Dashboard & API Server (NodePort 30443 / 30080).
    - `argocd-application-controller`: State diff engine with automated self-healing.
    - `argocd-repo-server`: Git clone and manifest rendering processor.
    - `argocd-redis`: High-speed state caching store.
    - `argocd-dex-server`: Identity broker and authentication provider.
    - `argocd-notifications`: Webhook and alerting dispatcher.
    - `coredns`: Upstream DNS resolver (`10.43.0.10 -> 8.8.8.8, 1.1.1.1`).
