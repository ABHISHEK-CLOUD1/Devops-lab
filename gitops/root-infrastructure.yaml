apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-infrastructure
  namespace: argocd
  labels:
    tier: master-control-plane
    environment: enterprise-hybrid-lab
  annotations:
    argocd.argoproj.io/description: "Master App-of-Apps coordinating all hybrid homelab tiers across on-prem Proxmox VE and Oracle Cloud Infrastructure."
    tier.title: "Hybrid Cloud Homelab — Master Infrastructure Orchestrator"
    link.argocd.argoproj.io/external-link: "https://192.168.155.142:30443"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/ABHISHEK-CLOUD1/Devops-lab.git'
    targetRevision: main
    path: gitops/apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
