apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-website
  namespace: argocd
  labels:
    app: portfolio
    source: github-abhis01
spec:
  project: default
  source:
    repoURL: 'https://github.com/ABHISHEK-CLOUD1/Devops-lab.git'
    targetRevision: main
    path: gitops/manifests/portfolio-website
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
