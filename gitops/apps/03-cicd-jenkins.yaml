apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cicd-jenkins
  namespace: argocd
  labels:
    tier: cicd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ABHISHEK-CLOUD1/Devops-lab.git'
    targetRevision: main
    path: gitops/manifests/cicd-jenkins
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: infra-cicd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
